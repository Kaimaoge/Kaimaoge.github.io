<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Redirects — Prof. Yuankai Wu</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <meta http-equiv="Cache-Control" content="no-store" />
  </head>
  <body>
    <main class="section">
      <div class="container flow">
        <h1>Redirecting…</h1>
        <p>If you are not redirected automatically, choose from the list below.</p>

        <div id="fallback" class="grid students"></div>
        <p><a class="btn" href="students.html">Back to Students</a></p>
      </div>
    </main>

    <script>
      const mapping = {
        'wang-lei': '#',
        'yuan-xinyun': '#',
        'cheng-jinguo': '#',
        'cai-wanlin': '#',
        'zhang-zhongyue': '#',
        'sun-changbin': '#',
        'liu-yangyou': '#',
        'xu-lin': '#',
        'liu-yiwei': '#',
        'wu-kunming': 'wukunming3',
        'zhang-chenhui': '#',
        'tang-jinfan': '#',
        'zhang-yuxuan': '#',
        'liu-jia': '#',
        'wu-lili': '#',
        'zhang-yiting': '#',
        'ye-peizi': '#',
        'dong-qingyu': '#'
      };

      // Unconfigured or incomplete URLs return to the matching roster card.
      // Set a mapping above to a complete https:// URL when a homepage is available.
      const params = new URLSearchParams(location.search);
      const to = params.get('to');
      const knownStudents = ['wang-lei', 'cheng-jinguo', 'cai-wanlin', 'zhang-zhongyue', 'sun-changbin', 'liu-yangyou', 'xu-lin', 'wu-kunming', 'zhang-chenhui', 'tang-jinfan', 'zhang-yuxuan', 'gong-xieruifeng', 'he-yuya', 'hu-jie', 'Wu-Junhui', 'Yan-Xinyue', 'xu-xin', 'cai-xinrong', 'li-chenshuo', 'liu-yiwei', 'liu-jia', 'yuan-xinyun', 'wu-lili', 'zhang-yiting', 'ye-peizi', 'dong-qingyu'];
      const validHomepage = url => typeof url === 'string' && /^https?:\/\//i.test(url);
      const fallback = document.getElementById('fallback');
      for (const slug of knownStudents) {
        const a = document.createElement('a');
        a.className = 'student-card';
        a.href = 'students.html#' + encodeURIComponent(slug);
        a.textContent = slug.replace(/-/g, ' ');
        fallback.appendChild(a);
      }
      if (to && knownStudents.includes(to)) {
        location.replace(validHomepage(mapping[to]) ? mapping[to] : 'students.html#' + encodeURIComponent(to));
      }
    </script>
  </body>
  </html>
